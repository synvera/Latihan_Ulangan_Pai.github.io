
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Soal Pilihan Ganda — Pendidikan Agama Islam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f2;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .wrapper { max-width: 760px; margin: 0 auto; }

  .header {
    background: #fff;
    border: 1px solid #e5e5e0;
    border-radius: 14px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.25rem;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: #111; }
  .header p { font-size: 13px; color: #777; margin-top: 4px; }
  .progress-bar {
    height: 4px;
    background: #eee;
    border-radius: 99px;
    margin-top: 14px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #3b82f6;
    border-radius: 99px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    color: #444;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #f5f5f2; }
  .btn.active { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; font-weight: 500; }
  .score-badge {
    margin-left: auto;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 8px;
    background: #fff;
    color: #666;
    border: 1px solid #e5e5e0;
  }
  .score-badge span { font-weight: 600; color: #111; }

  .question-card {
    background: #fff;
    border: 1px solid #e5e5e0;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .question-card.answered { border-color: #c7d2fe; }
  .question-card.correct { border-color: #86efac; background: #f0fdf4; }
  .question-card.wrong { border-color: #fca5a5; background: #fef2f2; }

  .q-header {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .q-num {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #f3f4f6;

    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    flex-shrink: 0;
    margin-top: 1px;

  .q-num.wrong-num { background: #fee2e2; color: #dc2626; }
  .q-text { font-size: 14px; line-height: 1.65; color: #1a1a1a; }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-left: 40px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #e5e5e0;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.5;
    color: #1a1a1a;
    background: #fafafa;
    transition: background 0.15s, border-color 0.15s;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }

  .option.selected { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }
  .option.correct-ans { background: #f0fdf4; border-color: #86efac; color: #15803d; }
  .option.wrong-ans { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }

  .option-label {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 1px;
    opacity: 0.6;
  }

  .q-result {
    margin-left: 40px;
    margin-top: 10px;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 8px;
    display: none;
  }

  .q-result.success { color: #15803d; background: #dcfce7; }
  .q-result.danger { color: #dc2626; background: #fee2e2; }

  .submit-area {
    background: #fff;
    border: 1px solid #e5e5e0;
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .summary { font-size: 13px; color: #777; }
  .btn-submit {
    font-size: 14px;
    padding: 9px 28px;
    border-radius: 10px;
    border: none;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn-submit:hover:not(:disabled) { opacity: 0.82; }
  .btn-submit:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <h1>Soal Pilihan Ganda — Pendidikan Agama Islam</h1>
    <p>Pilih satu jawaban yang paling tepat untuk setiap soal</p>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  </div>

</div>

  { q: "Di bawah ini adalah beberapa hikmah dari toleransi antarumat beragama, <strong>kecuali</strong> …", options: ["Berpikir positif terhadap keberadaan agama lain", "Dapat memaksa penganut agama lain untuk memeluk Islam", "Menyadari bahwa hidup ini tidak bisa terlepas dari orang lain", "Membangun tradisi dialog antaragama", "Saling menghormati dan menghargai antarpemeluk agama"], answer: 2 },
  { q: "QS. Yunus: 41 mengajarkan kita dalam menyikapi orang-orang yang mendustakan Al-Qur'an dengan cara mengatakan …", options: ["Bagiku pekerjaanku dan bagimu pekerjaanmu", "Bagiku agamaku dan bagimu agamamu", "Tuhanku tidak sama dengan Tuhanmu", "Kamu bukan penyembah Tuhan yang aku sembah", "Aku tidak bertanggung jawab atas perbuatanmu"], answer: 0 },
  { q: "Sikap toleransi adalah suatu sikap yang harus dijunjung tinggi dalam interaksi sosial masyarakat, karena …", options: ["Toleransi menenteramkan kehidupan masyarakat", "Toleransi diajarkan di sekolah/madrasah", "Toleransi terdapat pada undang-undang", "Toleransi merupakan terpecahnya solidaritas", "Toleransi bukan syarat utama dalam masyarakat"], answer: 0 },
];

const labels = ['A','B','C','D','E'];
const userAnswers = new Array(questions.length).fill(null);
let submitted = false;
let currentFilter = 'all';

function render() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const isAnswered = userAnswers[i] !== null;
    const isCorrect = submitted && userAnswers[i] === q.answer;
    const isWrong = submitted && userAnswers[i] !== null && userAnswers[i] !== q.answer;
    if (currentFilter === 'unanswered' && isAnswered) return;
    if (currentFilter === 'answered' && !isAnswered) return;

    const card = document.createElement('div');
    card.className = 'question-card'
      + (submitted && isCorrect ? ' correct' : '')
      + (submitted && isWrong ? ' wrong' : '')
      + (!submitted && isAnswered ? ' answered' : '');

    const numClass = submitted && isCorrect ? 'correct-num' : submitted && isWrong ? 'wrong-num' : '';

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num ${numClass}">${i+1}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options">
        ${q.options.map((opt, j) => {
          let cls = '';
          if (submitted) {
            if (j === q.answer) cls = 'correct-ans';
            else if (userAnswers[i] === j && j !== q.answer) cls = 'wrong-ans';
          } else if (userAnswers[i] === j) cls = 'selected';
          return `<button class="option ${cls}" onclick="selectAnswer(${i}, ${j})" ${submitted ? 'disabled' : ''}>
            <span class="option-label">${labels[j]}</span>
            <span>${opt}</span>
          </button>`;
        }).join('')}
      </div>
      ${submitted ? `<div class="q-result show ${isCorrect ? 'success' : 'danger'}">
        ${isCorrect
          ? '✓ Benar'
          : userAnswers[i] === null
            ? '— Tidak dijawab. Jawaban benar: ' + labels[q.answer]
            : '✗ Salah. Jawaban yang benar: ' + labels[q.answer]}
      </div>` : ''}
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  if (submitted) return;
  userAnswers[qIndex] = optIndex;
  updateStatus();
  render();
}

function updateStatus() {
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('progress').style.width = Math.round(answered / questions.length * 100) + '%';
  const btn = document.getElementById('submit-btn');
  if (submitted) {
    btn.disabled = true;
    btn.textContent = 'Selesai';
    const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
    document.getElementById('summary-text').innerHTML =
      `Nilai akhir: <strong>${correct}/${questions.length}</strong> benar &nbsp;·&nbsp; ${Math.round(correct/questions.length*100)}%`;
  } else {
    btn.disabled = answered < questions.length;
    document.getElementById('summary-text').textContent = answered === questions.length
      ? 'Semua soal sudah dijawab. Siap dikumpulkan!'
      : `${questions.length - answered} soal belum dijawab`;
  }
}

function submitAll() {
  if (submitted) return;
  submitted = true;
  updateStatus();
  render();
}

function filterQuestions(type) {
  currentFilter = type;
  document.querySelectorAll('.controls .btn').forEach((b, i) => {
    b.className = 'btn' + (['all','unanswered','answered'][i] === type ? ' active' : '');
  });
  render();
}

render();
updateStatus();
</script>
</body>
</html>
